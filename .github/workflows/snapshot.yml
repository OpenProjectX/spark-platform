name: Snapshot

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      ${{
        github.ref != 'refs/heads/master' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            !contains(github.event.head_commit.message, '[skip ci]') &&
            !contains(github.event.head_commit.message, '[ci skip]') &&
            !contains(github.event.head_commit.message, '[skip actions]')
          )
        )
      }}
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compute branch snapshot version
        shell: bash
        run: |
          PROJECT_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          BASE_VERSION=${PROJECT_VERSION%-SNAPSHOT}
          BRANCH_SLUG=$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+|-+$//g' | tr '[:upper:]' '[:lower:]')
          SNAPSHOT_VERSION="${BASE_VERSION}-${BRANCH_SLUG}-SNAPSHOT"
          echo "SNAPSHOT_VERSION=$SNAPSHOT_VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_version=$SNAPSHOT_VERSION" >> "$GITHUB_ENV"

      - name: Cache Jib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/google-cloud-tools-java/jib
            ~/.jib-cache
          key: ${{ runner.os }}-jib-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-jib-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Java artifacts
        run: ./gradlew test --no-configuration-cache

      - name: Publish Java snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishSnapshotToGitHubPackages --no-configuration-cache

      - name: Publish curated platform snapshot images
        run: ./gradlew :platform-image:jibPublishAllPlatformImages --no-configuration-cache
